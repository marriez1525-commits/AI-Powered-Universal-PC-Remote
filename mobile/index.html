<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PCPilot</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="app">

        <header>
            <h1>PCPilot</h1>
            <p>Universal PC Remote</p>

            <div id="connection-status">
                🔴 Connecting...
            </div>
        </header>

        <main>

            <section class="welcome-card">
                <h2>Welcome to PCPilot</h2>

                <p>
                    Control your computer directly
                    from your phone.
                </p>

                <div class="status">
                    <span id="status-icon">🔴</span>
                    <span id="status-text">
                        Connecting to PC...
                    </span>
                </div>
            </section>

        </main>

    </div>

    <script src="js/app.js"></script>

</body>
</html>
