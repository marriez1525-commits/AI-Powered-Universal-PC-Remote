<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PCPilot</title>

    <!-- Main CSS -->
    <link rel="stylesheet" href="/style/style.css">

    <!-- Touchpad CSS -->
    <link rel="stylesheet" href="/style/touchpad.css">

    <!-- Keyboard CSS -->
    <link rel="stylesheet" href="/style/keyboard.css">

</head>


<body>

<div class="app">

    <!-- ================================= -->
    <!-- HEADER -->
    <!-- ================================= -->

    <header>

        <h1>PCPilot</h1>

        <p>Universal PC Remote</p>

        <div id="connection-status">
            🔴 Connecting...
        </div>

    </header>


    <!-- ================================= -->
    <!-- MAIN -->
    <!-- ================================= -->

    <main>

        <!-- ================================= -->
        <!-- CONNECTION CARD -->
        <!-- ================================= -->

        <section class="welcome-card">

            <h2>Welcome to PCPilot</h2>

            <p>
                Control your computer directly
                from your phone.
            </p>

            <div class="status">

                <span id="status-icon">
                    🔴
                </span>

                <span id="status-text">
                    Connecting to PC...
                </span>

            </div>

        </section>


        <!-- ================================= -->
        <!-- TOUCHPAD -->
        <!-- ================================= -->

        <section class="touchpad-section">

            <div class="section-title">

                <h2>
                    🖱️ Touchpad
                </h2>

                <span>
                    Move your finger to control the cursor
                </span>

            </div>


            <!-- ================================= -->
            <!-- ACTUAL TOUCHPAD -->
            <!-- ================================= -->

            <div
                id="touchpad"
                class="touchpad"
            >

                <div class="touchpad-message">
                    Move your finger here
                </div>

            </div>


            <!-- ================================= -->
            <!-- MOUSE BUTTONS -->
            <!-- ================================= -->

            <div class="mouse-buttons">

                <button
                    id="left-click"
                    type="button"
                >
                    🖱️ Left Click
                </button>


                <button
                    id="right-click"
                    type="button"
                >
                    🖱️ Right Click
                </button>

            </div>


            <!-- ================================= -->
            <!-- DOUBLE CLICK -->
            <!-- ================================= -->

            <div class="extra-controls">

                <button
                    id="double-click"
                    type="button"
                >
                    🖱️ Double Click
                </button>

            </div>

        </section>


        <!-- ================================= -->
        <!-- KEYBOARD -->
        <!-- ================================= -->

        <section class="keyboard-section">

            <!-- KEYBOARD TITLE -->

            <div class="keyboard-title">

                <h2>
                    ⌨️ Keyboard
                </h2>

                <p>
                    Type and control your PC keyboard
                </p>

            </div>


            <!-- ================================= -->
            <!-- TEXT INPUT -->
            <!-- ================================= -->

            <textarea
                id="keyboard-input"
                class="keyboard-input"
                placeholder="Type something for your PC..."
            ></textarea>


            <!-- ================================= -->
            <!-- SEND BUTTON -->
            <!-- ================================= -->

            <button
                id="keyboard-send"
                class="keyboard-send"
                type="button"
            >
                Send to PC
            </button>


            <!-- ================================= -->
            <!-- SPECIAL KEYS -->
            <!-- ================================= -->

            <div class="keyboard-special">

                <button
                    id="key-esc"
                    type="button"
                >
                    ESC
                </button>


                <button
                    id="key-tab"
                    type="button"
                >
                    TAB
                </button>


                <button
                    id="key-enter"
                    type="button"
                >
                    ENTER
                </button>


                <button
                    id="key-backspace"
                    type="button"
                >
                    BACKSPACE
                </button>


                <button
                    id="key-delete"
                    type="button"
                >
                    DELETE
                </button>


                <button
                    id="hotkey-copy"
                    type="button"
                >
                    CTRL + C
                </button>


                <button
                    id="hotkey-paste"
                    type="button"
                >
                    CTRL + V
                </button>


                <button
                    id="hotkey-select-all"
                    type="button"
                >
                    CTRL + A
                </button>

            </div>


            <!-- ================================= -->
            <!-- ARROW KEYS -->
            <!-- ================================= -->

            <div class="arrow-keys">

                <div class="arrow-empty"></div>


                <button
                    id="key-up"
                    type="button"
                >
                    ↑
                </button>


                <div class="arrow-empty"></div>


                <button
                    id="key-left"
                    type="button"
                >
                    ←
                </button>


                <button
                    id="key-down"
                    type="button"
                >
                    ↓
                </button>


                <button
                    id="key-right"
                    type="button"
                >
                    →
                </button>

            </div>

        </section>

    </main>

</div>


<!-- ================================= -->
<!-- JAVASCRIPT -->
<!-- ================================= -->

<script src="/js/app.js"></script>

<script src="/js/touchpad.js"></script>

<script src="/js/keyboard.js"></script>


</body>

</html>
